# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the RentalOps API as a Docker web service. The database (Supabase) and Redis
# (Upstash) are external — their connection details go in as environment variables at deploy
# time (Render prompts for every `sync: false` key). The frontend is on Vercel.
#
#   1. Push to GitHub.
#   2. Render dashboard → New → Blueprint → pick this repo.
#   3. Fill the prompted values (see docs/DEPLOYMENT.md for exactly where each comes from).
#   4. After the frontend is live on Vercel, set CORS_ALLOWED_ORIGINS to its URL and redeploy.
#
# Free tier: the service sleeps after 15 min idle (~30-50 s cold start on the next request).

services:
  - type: web
    name: rentalops-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ---- Supabase Postgres (use the Session-mode pooler, port 5432) ----
      # DB_URL: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_URL
        sync: false
      # DB_USERNAME: postgres.<project-ref>
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # ---- Auth ----
      - key: JWT_SECRET
        generateValue: true            # Render generates a strong random value once
      - key: CORS_ALLOWED_ORIGINS
        sync: false                    # the Vercel URL — set after the frontend's first deploy

      # ---- Upstash Redis ----
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_HOST
        sync: false                    # <name>.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"
      - key: SPRING_CACHE_TYPE
        value: redis                   # or "caffeine" to keep the dashboard cache off Upstash's command budget

      # ---- Background jobs ----
      - key: JOBS_AUTORUN
        value: "true"

      # ---- Optional: Claude maintenance triage ----
      # - key: ANTHROPIC_API_KEY
      #   sync: false
